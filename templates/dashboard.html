<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - WellFit</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body.wf-dashboard-body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-image: url('/static/profile_bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #1a1025;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 48px;
        }

        body.wf-dashboard-body .container.dashboard-container {
            background: transparent;
            box-shadow: none;
            max-width: 1100px;
            width: 100%;
            padding: 0;
        }

        /* Glass panel (matches profile page) */
        .wf-dash-glass {
            background: rgba(40, 20, 60, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 32px 36px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Header row: title + profile icon */
        .wf-dash-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 8px;
        }

        .wf-dash-header h1 {
            font-size: clamp(1.5rem, 4vw, 1.85rem);
            font-weight: 700;
            color: #fff;
            margin: 0 0 6px 0;
            letter-spacing: -0.02em;
        }

        .wf-dash-sub {
            font-size: 15px;
            color: #d8b4e2;
            margin: 0 0 12px 0;
            line-height: 1.45;
        }

        #profileInfo {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.5;
        }

        #profileInfo strong {
            color: #e9d5ff;
            font-weight: 600;
        }

        .wf-profile-icon {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #a855f7;
            background: rgba(168, 85, 247, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .wf-profile-icon:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        .wf-profile-icon svg {
            width: 26px;
            height: 26px;
            fill: #c4b5fd;
        }

        /* Primary CTA */
        .wf-btn-generate {
            width: 100%;
            margin: 20px 0 22px;
            padding: 16px 24px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(90deg, #7c3aed 0%, #be185d 55%, #9333ea 100%);
            box-shadow: 0 8px 28px rgba(126, 34, 206, 0.45);
            transition: transform 0.2s, filter 0.2s;
        }

        .wf-btn-generate:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .wf-btn-generate:active {
            transform: translateY(0);
        }

        /* Pill toggle group */
        .wf-toggle-wrap {
            display: flex;
            gap: 0;
            padding: 6px;
            background: rgba(20, 10, 35, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            margin-bottom: 24px;
            max-width: 100%;
        }

        .wf-tab {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 999px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: #d8b4e2;
            transition: background 0.25s, color 0.25s;
            white-space: nowrap;
        }

        .wf-tab.wf-tab-active {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.35);
        }

        .wf-tab:not(.wf-tab-active):hover {
            color: #fff;
        }

        /* Two-column cards */
        .wf-dash-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .wf-dash-grid {
                grid-template-columns: 1fr;
            }
        }

        .wf-dash-card {
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            min-height: 200px;
            padding: 18px 16px 20px;
            background: rgba(15, 8, 28, 0.35);
        }

        .wf-dash-card h3 {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #e9d5ff;
            margin: 0 0 14px 0;
            text-align: center;
        }

        /* Dark-theme overrides for plan content */
        .wf-dashboard-page .plan-section {
            background: transparent;
            padding: 0;
            margin: 0;
        }

        .wf-dashboard-page .plan-item {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid #a855f7;
        }

        .wf-dashboard-page .plan-item h4 {
            color: #f5f3ff;
        }

        .wf-dashboard-page .plan-item p {
            color: rgba(255, 255, 255, 0.72);
        }

        /* All meals scroll; viewport fits ~5 cards, then scroll for more */
        .wf-diet-meals-scroll {
            margin-top: 14px;
            max-height: min(52vh, 32rem);
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 4px 6px 8px 0;
            scrollbar-gutter: stable;
        }

        .wf-diet-meals-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .wf-diet-meals-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
        }

        .wf-diet-meals-scroll::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.5);
            border-radius: 8px;
        }

        .wf-diet-meals-scroll .plan-item:last-child {
            margin-bottom: 4px;
        }

        .wf-dashboard-page .stat-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .wf-dashboard-page .stat-box h3 {
            color: #d8b4e2;
        }

        .wf-dashboard-page .stat-box p {
            color: rgba(255, 255, 255, 0.65);
        }

        .wf-dashboard-page .loading {
            color: rgba(255, 255, 255, 0.55);
        }

        .wf-dashboard-page .wb-split-label {
            color: #d8b4e2;
        }

        .wf-dashboard-page .wb-day-tab {
            background: rgba(255, 255, 255, 0.08);
            color: #e9d5ff;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .wf-dashboard-page .wb-day-tab.active {
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            color: #fff;
            border-color: transparent;
        }

        .wf-dashboard-page .wb-ex-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .wf-dashboard-page .wb-ex-card-header {
            color: #f5f3ff;
        }

        .wf-dashboard-page .wb-ex-stat-label {
            color: rgba(255, 255, 255, 0.55);
        }

        .wf-dashboard-page .wb-ex-stat-value {
            color: #fff;
        }

        .wf-dashboard-page .wb-rest-day {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Pain section */
        .wf-pain-block label {
            color: #f1e4fa;
        }

        .wf-pain-block textarea,
        .wf-pain-block input {
            background: rgba(20, 10, 35, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 8px;
        }

        .wf-pain-block button[type="submit"] {
            background: linear-gradient(90deg, #6b21a8, #be185d);
            box-shadow: 0 4px 15px rgba(190, 24, 93, 0.35);
        }

        .wf-dash-footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .wf-dash-footer-links a {
            color: #d8b4e2;
            text-decoration: none;
            font-weight: 500;
        }

        .wf-dash-footer-links a:hover {
            color: #fff;
            text-decoration: underline;
        }

        .wf-dash-footer-links .sep {
            color: rgba(255, 255, 255, 0.35);
            margin: 0 8px;
        }

        .wf-dashboard-page .message {
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .wf-dashboard-page .message.success {
            background: rgba(74, 222, 128, 0.15);
            color: #86efac;
            border: 1px solid rgba(74, 222, 128, 0.35);
        }

        .wf-dashboard-page .message.error {
            background: rgba(248, 113, 113, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(248, 113, 113, 0.35);
        }

        .wf-dashboard-page .message.warning {
            background: rgba(250, 204, 21, 0.14);
            color: #fde68a;
            border: 1px solid rgba(250, 204, 21, 0.35);
        }
    </style>
</head>

<body class="wf-dashboard-body">
    <div class="container dashboard-container wf-dashboard-page">
        <div class="wf-dash-glass">
            <header class="wf-dash-header">
                <div>
                    <h1>WellFit Dashboard</h1>
                    <p class="wf-dash-sub">Your personalized fitness and nutrition hub</p>
                    <div id="profileInfo"></div>
                </div>
                <a href="/profile.html" class="wf-profile-icon" title="Your profile" aria-label="Profile">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                    </svg>
                </a>
            </header>

            <div id="message" class="message"></div>

            <button type="button" onclick="generatePlans()" id="generateBtn" class="wf-btn-generate">Generate New Plan</button>

            <div class="wf-toggle-wrap">
                <button type="button" id="tabPlans" class="wf-tab wf-tab-active" onclick="showPlan('plans')">Workout &amp;
                    diet</button>
                <button type="button" id="tabPain" class="wf-tab" onclick="showPlan('pain')">Pain or discomfort</button>
            </div>

            <div id="plansTab">
                <div class="wf-dash-grid">
                    <div class="wf-dash-card">
                        <h3>Diet</h3>
                        <div id="dietPlan" class="plan-section">
                            <p class="loading">Loading...</p>
                        </div>
                    </div>
                    <div class="wf-dash-card">
                        <h3>Workout</h3>
                        <div id="workoutPlan" class="plan-section">
                            <p class="loading">Loading...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="painPlanSection" style="display: none;">
                <h2 style="font-size: 1.15rem; color: #f5f3ff; margin: 0 0 12px 0; border: none;">Pain or discomfort?
                </h2>
                <div class="plan-section wf-pain-block">
                    <p style="margin-bottom: 15px; color: #d8b4e2; font-size: 14px;">Report any pain to adapt your
                        workout safely</p>
                    <form onsubmit="adaptWorkout(event)">
                        <div class="form-group">
                            <label for="painText">Describe your pain</label>
                            <textarea id="painText" rows="3"
                                placeholder="e.g., I have knee pain when squatting"></textarea>
                        </div>
                        <button type="submit">Adapt Workout</button>
                    </form>

                    <div id="painResult"
                        style="display: none; margin-top: 20px; background: rgba(15,8,28,0.5); border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); overflow: hidden;">
                        <div id="painAlert" class="pain-alert"
                            style="margin: 0; border: none; border-bottom: 1px solid rgba(255,255,255,0.1); border-radius: 0; background: rgba(234,179,8,0.12); color: #fde68a;">
                        </div>
                        <div style="padding: 15px;">
                            <h3 style="margin-top: 0; color: #f5f3ff; font-size: 1.05rem;">Adapted Workout for Today
                            </h3>
                            <div id="adaptedExercises"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <p class="wf-dash-footer-links">
            <a href="/profile.html">Edit profile</a><span class="sep">·</span><a href="#"
                onclick="logout(); return false;">Logout</a>
        </p>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            initDashboard();
        });
    </script>
</body>

</html>
