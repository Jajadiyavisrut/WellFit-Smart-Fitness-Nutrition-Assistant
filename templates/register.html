<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - WellFit</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #0f081c;
            background-image: radial-gradient(circle at top right, rgba(168, 85, 247, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(190, 24, 93, 0.15), transparent 40%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        .wf-auth-container {
            background: rgba(40, 20, 60, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .wf-auth-container h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #e9d5ff, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .wf-auth-container p {
            color: #d8b4e2;
            font-size: 15px;
            margin: 0 0 30px 0;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #e9d5ff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 8, 28, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
            background: rgba(20, 10, 35, 0.7);
        }

        .show-pw-wrapper {
            position: relative;
        }

        .show-pw-wrapper input {
            padding-right: 46px;
        }

        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: 4px;
            color: #a855f7;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-pw:hover {
            color: #d8b4e2;
        }

        .toggle-pw svg {
            width: 20px;
            height: 20px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(90deg, #7c3aed 0%, #be185d 100%);
            box-shadow: 0 8px 24px rgba(126, 34, 206, 0.4);
            margin-top: 10px;
            transition: transform 0.2s, filter 0.2s;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .link {
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .link a {
            color: #d8b4e2;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .link a:hover {
            color: #fff;
        }

        /* Messages */
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            text-align: left;
        }

        .message.success {
            background: rgba(74, 222, 128, 0.15);
            color: #86efac;
            border: 1px solid rgba(74, 222, 128, 0.35);
        }

        .message.error {
            background: rgba(248, 113, 113, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(248, 113, 113, 0.35);
        }
    </style>
</head>
<body>
    <div class="wf-auth-container">
        <h1>Join WellFit</h1>
        <p>Create your account to start your fitness journey.</p>

        <div id="message" class="message"></div>

        <div id="registerSection">
            <form onsubmit="registerUser(event)">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="show-pw-wrapper">
                        <input type="password" id="password" required minlength="8"
                               placeholder="Min 8 chars, upper + lower + number">
                        <button type="button" class="toggle-pw" onclick="togglePw('password', this)" title="Show/hide password">
                            <svg id="eye-password" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="show-pw-wrapper">
                        <input type="password" id="confirm_password" required minlength="8"
                               placeholder="Repeat your password">
                        <button type="button" class="toggle-pw" onclick="togglePw('confirm_password', this)" title="Show/hide password">
                            <svg id="eye-confirm" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" id="registerBtn">Create Account</button>
            </form>
        </div>

        <div class="link">
            Already have an account? <a href="/login.html">Sign in here</a>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
